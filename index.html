<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Dokumentasi Saya</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Kumpulan dokumentasi dan catatan markdown">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  
  <!-- Stylesheet Darklight Theme (menggantikan tema bawaan vue.css) -->
  <link 
    rel="stylesheet" 
    href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme"
    type="text/css"
  />
</head>
<body>
  <div id="app">Memuat dokumen...</div>

  <script>
    window.$docsify = {
      name: 'Catatan & Dokumen',
      repo: '', 
      loadSidebar: true,
      subMaxLevel: 2,
      auto2top: true,
      
      // Pengaturan Dark & Light Mode
      darklightTheme: {
        siteFont: 'system-ui, -apple-system, sans-serif',
        defaultTheme: 'light', // Pilihan default: 'light' atau 'dark'
        dark: {
          accent: '#42b983',
          background: '#0f172a',
          textColor: '#e2e8f0',
          codeBackgroundColor: '#1e293b',
          codeTextColor: '#f8fafc',
          borderColor: '#334155'
        },
        light: {
          accent: '#42b983',
          background: '#ffffff',
          textColor: '#1e293b',
          codeBackgroundColor: '#f1f5f9',
          codeTextColor: '#0f172a',
          borderColor: '#e2e8f0'
        }
      },

      // Pengaturan fitur pencarian
      search: {
        maxAge: 86400000,
        paths: 'auto',
        placeholder: 'Cari topik...',
        noData: 'Hasil tidak ditemukan!',
        depth: 3
      }
    };
  </script>

  <!-- Script Inti Docsify -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  
  <!-- Plugin Darklight Theme -->
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js" type="text/javascript"></script>

  <!-- Plugin Pencarian & Salin Kode -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>

  <!-- Syntax Highlighting (PrismJS Components) -->
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-bash.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-python.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-markdown.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-typescript.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-sql.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-go.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/prismjs@1/components/prism-docker.min.js"></script>
</body>
</html>
